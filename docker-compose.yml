services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: mtgmeta
      POSTGRES_PASSWORD: mtgmeta
      POSTGRES_DB: mtgmeta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtgmeta -d mtgmeta"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
