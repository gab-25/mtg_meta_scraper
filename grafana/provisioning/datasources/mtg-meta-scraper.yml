apiVersion: 1
datasources:
  - name: MTG Meta DB
    uid: mtg-meta-scraper-db
    type: grafana-postgresql-datasource
    access: proxy
    url: ${MTG_META_SCRAPER_DB_HOST}:5432
    # Read-only role, created by the scraper's migrations.
    user: grafana_reader
    isDefault: true
    editable: false
    jsonData:
      database: ${MTG_META_SCRAPER_DB_NAME}
      sslmode: ${MTG_META_SCRAPER_DB_SSLMODE}
      timescaledb: true
      postgresVersion: 1600
    secureJsonData:
      password: ${MTG_META_SCRAPER_DB_READER_PASSWORD}
