# Only for command-line use during development, e.g.:
#   uv run alembic revision --autogenerate -m "description"
#   uv run alembic upgrade head
# The database is taken from DATABASE_URL (default: localhost). In production, migrations
# run automatically when the scraper starts.
[alembic]
script_location = mtg_meta_scraper/db/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
