# Solo per l'uso da riga di comando in sviluppo, es.:
#   uv run alembic revision --autogenerate -m "descrizione"
#   uv run alembic upgrade head
# Il database è preso da DATABASE_URL (default: localhost). In produzione le migrazioni
# girano da sole all'avvio dello scraper.
[alembic]
script_location = mtg_meta_scraper/db/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
