name: CI

on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: mtg_meta_scraper
          POSTGRES_PASSWORD: mtg_meta_scraper
          POSTGRES_DB: mtg_meta_scraper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mtg_meta_scraper -d mtg_meta_scraper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      REQUIRE_TEST_DB: "1"
      TEST_DATABASE_URL: postgresql://mtg_meta_scraper:mtg_meta_scraper@localhost:5432/mtg_meta_scraper_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --python 3.12
      - name: Run tests
        run: uv run pytest -v

  docker:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t mtg-meta-scraper:${{ github.event.release.tag_name }} .
      - name: Smoke test
        run: docker run --rm mtg-meta-scraper:${{ github.event.release.tag_name }} python -m mtg_meta_scraper --help
