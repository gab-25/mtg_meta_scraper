[project]
name = "mtg-meta-scraper"
version = "0.3.0"
description = "MTGTop8 -> TimescaleDB -> Grafana scraper for metagame analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "alembic-utils>=0.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mtg_meta_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
