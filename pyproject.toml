[project]
name = "mtg-meta-scraper"
version = "0.1.0"
description = "Scraper MTGTop8 -> TimescaleDB -> Grafana per l'analisi del metagame"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtg_meta_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
